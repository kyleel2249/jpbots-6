name: Deploy JP Bots 6 backend

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '5 0 * * *' # Retry deployments after Cloudflare's D1 Free daily quota reset.

permissions:
  contents: read

concurrency:
  group: jp-bots-6-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test
      - run: npm run build
      - run: npm run typecheck:worker
      - run: npm run db:local
      - run: npx wrangler deploy --dry-run
      - name: Restore successful backend deployment marker
        id: backend-deployed
        uses: actions/cache/restore@v4
        with:
          path: .backend-deployed
          key: backend-deployed-${{ github.sha }}
      - name: Apply production D1 migrations
        if: steps.backend-deployed.outputs.cache-hit != 'true'
        run: npx wrangler d1 migrations apply jpbots-6_db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        if: steps.backend-deployed.outputs.cache-hit != 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing from GitHub Actions repository secrets."
            exit 1
          fi
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record successful backend deployment
        if: success() && steps.backend-deployed.outputs.cache-hit != 'true'
        run: printf '%s\n' "$GITHUB_SHA" > .backend-deployed
      - name: Cache successful backend deployment marker
        if: success() && steps.backend-deployed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .backend-deployed
          key: backend-deployed-${{ github.sha }}
