name = "jp-bots-6-backend"
main = "backend/worker.ts"
compatibility_date = "2026-11-27"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "jp-bots-6"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "AgentOrchestrator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentOrchestrator"]

[triggers]
crons = ["* * * * *"]
