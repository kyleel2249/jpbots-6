name = "jp-bots-6-backend"
main = "backend/worker.ts"
compatibility_date = "2026-11-27"
workers_dev = true

[vars]
LIVE_TRADING_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "jp-bots-6"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "AgentOrchestrator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentOrchestrator"]

[triggers]
crons = ["* * * * *"]
