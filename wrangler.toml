name = "jp-bots-6-backend"
main = "backend/worker.ts"
compatibility_date = "2026-11-27"
workers_dev = true
account_id = "08c532bd849cab6fbecdffbdf1718aa9"

[[d1_databases]]
binding = "DB"
database_name = "jpbots-6_db"
database_id = "cb74859a-b5a2-4347-9249-2de75b4369df"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "AgentOrchestrator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentOrchestrator"]

[triggers]
crons = ["* * * * *"]

[vars]
AI_ENABLED = "false"
AUTO_PAPER_ENABLED = "false"
AMD_PAPER_FORWARD_ENABLED = "false"
AMD_SESSION_TIMEZONE = "UTC"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

[[kv_namespaces]]
binding = "KV_BINDING"
id = "4db9e3faff394ca483a7592c6d71a14c"

[ai]
binding = "AI"
